server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The shared Game Lab host forwards this public prefix directly to the
    # game service. Strip it before resolving files in this image, while
    # keeping browser URLs under the catalog-owned prefix.
    location = /games/milton-estates {
        return 301 /games/milton-estates/;
    }

    location = /games/milton-estates/healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed assets are safe to retain for a year. Keep this regex before the
    # generic asset rule so the prefixed location cannot bypass cache policy.
    location ~* "^/games/milton-estates/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:css|js|mjs|json|webmanifest|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp3|ogg|wav)$" {
        rewrite ^/games/milton-estates/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/games/milton-estates/.+\.(?:css|js|mjs|json|webmanifest|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp3|ogg|wav)$ {
        rewrite ^/games/milton-estates/(.*)$ /$1 break;
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /games/milton-estates/ {
        rewrite ^/games/milton-estates/(.*)$ /$1 break;
        try_files $uri $uri/ @milton-spa;
    }

    location / {
        try_files $uri $uri/ @milton-spa;
    }

    location @milton-spa {
        if ($http_accept !~* "text/html") { return 404; }
        try_files /index.html =404;
    }

    location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:css|js|mjs|json|webmanifest|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp3|ogg|wav)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|json|webmanifest|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp3|ogg|wav)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
