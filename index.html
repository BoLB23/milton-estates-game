<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102e28" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Milton Estates</title>
  </head>
  <body>
    <a class="exit-to-catalog" data-exit-to-catalog href="../">Exit to catalog</a>
    <main id="game" aria-label="Milton Estates game"></main>
    <div class="portrait-message" role="status" aria-live="polite">
      <strong>Turn your device sideways</strong>
      <span>Milton Estates is built for landscape play.</span>
    </div>
    <nav class="touch-controls" aria-label="Touch game controls">
      <div class="touch-joystick" data-game-joystick aria-label="Movement joystick" role="group">
        <div class="touch-joystick-stick" aria-hidden="true"></div>
      </div>
      <div class="touch-actions">
        <button data-game-action="menu" aria-label="Open Backpack">BACKPACK</button>
        <button class="touch-act" data-game-action="interact" aria-label="Interact or confirm">ACT</button>
      </div>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
