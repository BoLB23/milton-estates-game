apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: milton-estates-game
  namespace: games
  labels:
    app.kubernetes.io/name: milton-estates-game
  annotations:
    cert-manager.io/cluster-issuer: bolblab-cf-issuer
    # ExternalDNS must publish this hostname to the Cloudflare Tunnel rather
    # than the private address advertised by the in-cluster ingress controller.
    external-dns.alpha.kubernetes.io/target: 3f6e31eb-7a1b-46a6-b8cf-421e33238beb.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - games.bolblab.org
      secretName: games-bolblab-org-tls
  rules:
    - host: games.bolblab.org
      http:
        paths:
          # This resource is deliberately narrowed to the Game Lab-owned
          # public mount; the catalog/API Ingress owns the host root.
          - path: /games/milton-estates
            pathType: Prefix
            backend:
              service:
                name: milton-estates-game
                port:
                  name: http
