apiVersion: apps/v1
kind: Deployment
metadata:
  name: milton-estates-game
  namespace: games
  labels:
    app.kubernetes.io/name: milton-estates-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: milton-estates-game
  template:
    metadata:
      labels:
        app.kubernetes.io/name: milton-estates-game
    spec:
      containers:
        - name: game
          # Never apply this placeholder directly. scripts/deploy.sh renders the
          # requested immutable GHCR image before applying the Deployment once.
          image: ghcr.io/replace-me/milton-estates-game:sha-0000000000000000000000000000000000000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
